<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1f5fbf">
  <title>2026 학교로 찾아가는 SW체험수업 · 사전 협의</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <div class="brand">경남수학문화관</div>
      <h1>2026. 학교로 찾아가는 SW체험수업<br>사전 협의 응답</h1>
      <p class="lead">학교를 선택하고 확인코드를 입력하면 신청서 내용이 표시됩니다.<br>휴대폰으로 약 3분이면 응답이 끝납니다. 입력 중인 내용은 이 기기에 자동 저장됩니다.</p>
    </div>
  </header>

  <main class="wrap">
    <div id="fatal" class="card alert" hidden></div>

    <section id="step-select" class="card">
      <h2>1. 학교 확인</h2>
      <div class="field">
        <label class="lbl" for="schoolSelect">학교 선택 <span class="req">*</span></label>
        <select id="schoolSelect">
          <option value="">학교를 선택하세요</option>
        </select>
      </div>
      <div class="field">
        <label class="lbl" for="codeInput">확인코드 4자리 <span class="req">*</span></label>
        <input id="codeInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" placeholder="예: 1234">
        <p class="hint">확인코드는 담당교사께 문자·공문으로 개별 안내된 4자리 숫자입니다.</p>
        <p id="unlockError" class="err" hidden></p>
      </div>
      <button id="unlockBtn" type="button" class="btn primary block">본인 학교 확인</button>
    </section>

    <div id="doneBanner" class="card notice" hidden></div>

    <section id="info" class="card" hidden></section>

    <form id="form" novalidate hidden autocomplete="off"></form>

    <section id="result" class="card" hidden></section>
  </main>

  <div id="submitBar" class="submitbar" hidden>
    <div class="wrap">
      <div class="savestate"><span id="saveState">아직 저장된 내용 없음</span> · <button type="button" id="clearDraft" class="linkbtn">입력 초기화</button></div>
      <button type="button" id="submitBtn" class="btn primary block">응답 제출하기</button>
      <div id="submitError" class="err-box" hidden></div>
    </div>
  </div>

  <footer class="wrap" id="footer"></footer>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
